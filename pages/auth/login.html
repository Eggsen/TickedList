<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/12ec0fec7b.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/output.css">
    <title>Login</title>
</head>
<body>
    
    <main class="w-full h-screen">
        <div class="section-container flex items-center justify-center bg-linear-to-b from-white to-yellow-400 p-6 h-screen box-border">
            <section class="flex flex-col flex-1 h-full p-3">
                <div class="app-title border w-1/3 sm:w-1/4 md:w-1/5 bg-yellow-300 text-center rounded-3xl py-2">
                    <span>Tickedlist</span>
                </div>
                <div class="form-container flex items-center flex-col justify-center h-full w-full">
                    <form action="" id="loginForm" class="w-full max-w-md flex flex-col justify-center gap-2 rounded-2xl">
                        <header class="flex flex-col items-center text-center gap-1">
                            <h1 class="text-2xl text-start font-medium" >Welcome back!</h1>
                            <span class="text-xs">Be productive and manage your tasks well!</span>
                        </header>
                        <div class="notice flex justify-center w-full">
                            <span class="text-center w-full wrap-break-word bg-red-600/50 text-white rounded-lg" id="notice"></span>
                        </div>
                        <fieldset class="flex flex-col gap-3">
                            <label for="">Email</label>
                            <input
                            id="email"
                            type="email"
                            placeholder="Enter email"
                            class="invalid:border-red-500 invalid:text-red-600 focus:border-sky-500 focus:outline focus:outline-sky-500 focus:invalid:border-red-500 focus:invalid:outline-red-500 bg-white px-4 py-3 rounded-3xl"
                            />
                            <label for="">Password</label>
                            <input
                            id="password"
                            type="password"
                            placeholder="Enter password"
                            class="bg-white px-4 py-3 rounded-3xl"
                            />
                        </fieldset>
                        <div class="flex items-center justify-between">
                            <div class="remember-me">
                                <input type="checkbox">
                                <span>Remember me</span>
                            </div>
                            <div class="forget-password">
                                <a href="" class="text-xs underline">Forgot password?</a>
                            </div>
                        </div>
                        <button class="bg-yellow-400 text-white font-bold rounded-lg p-1 cursor-pointer" type="submit">Login</button>
                    </form>
                </div>
                <div class="section-footer flex justify-between text-xs sm:text-sm">
                    <span>Don't have an account? <a href="signup.html" class="underline">Sign up</a></span>
                    <a href="" class="underline">Terms & Conditions</a>
                </div>
            </section>

            <section class="hidden flex-1 h-full lg:block">
                <img 
                src="/assets/images/StockCake-Cozy_Workspace_Vibes-3464658-medium.jpg" 
                alt=""
                class="w-full h-full object-cover rounded-2xl"
                >
            </section>
        </div>
        
    </main>
    
    <script src="/scripts/main.js" type="module"></script>
</body>
</html>
